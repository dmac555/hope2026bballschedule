<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hope Youth Basketball Schedule 2026–2027</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0f172a; }
    #calendarFrame { display: block; width: 100%; height: 100%; border: 0; }
    #syncStatus {
      position: fixed;
      right: 12px;
      bottom: 12px;

      border-radius: 8px;
      color: white;
      font: 600 13px/1.3 system-ui, sans-serif;
    }
    .hidden { display: none; }
    .bg-emerald-700 { background: #047857; }
    .bg-rose-700 { background: #be123c; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="syncStatus" class="hidden" role="status" aria-live="polite"></div>
  <iframe id="calendarFrame" title="Hope Youth Basketball calendar" src="./hope-basketball-calendar.html"></iframe>
  <script src="./supabase-calendar-bridge.js"></script>
</body>
</html>
